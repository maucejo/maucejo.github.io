# Mathieu Aucejo — personal academic website, built with Calepin.
#
#   calepin compile .                       # build into _site/
#   calepin watch . _site --serve --open    # live preview
#   python3 scripts/update_publications.py  # refresh the HAL publication list

title = "Mathieu Aucejo"
description = "Full professor of Structural Mechanics and Acoustics at Le Cnam (MACS), Paris. Inverse problems, vibration control and vibro-acoustics."
base-url = "https://maucejo.github.io"

theme = "themes/aucejo"
logo = "assets/images/logo.svg"
logo-alt = "Mathieu Aucejo"
favicon = "assets/images/logo.svg"
image = "assets/images/avatar.jpg"
theme-color = "#11304C"

output-dir = "_site"
asset-dir = "_calepin"   # GitHub Pages does not serve dot-directories
pdf = false
typ = false

[static]
include = ["assets/**"]

# Helper modules and data are imported by pages, not published as pages.
[pages]
exclude = ["_lib/**", "scripts/**", "_site/**"]

[toc]
enabled = false

# ---------------------------------------------------------------------------
# Values available to theme templates as {{ store.* }}
# ---------------------------------------------------------------------------
[store]
name = "Mathieu Aucejo"
role = ["Full Professor", "Structural Mechanics & Acoustics"]
affiliation = "MACS · Conservatoire national des arts et métiers"
affiliation_url = "https://www.macs.cnam.fr/"
lab = "MACS"
institution = "Conservatoire national des arts et métiers"
location = "Paris, France"
email = "mathieu.aucejo@lecnam.net"
avatar = "assets/images/avatar.jpg"
tagline = "I develop methods to identify, model and control vibrations and sound in mechanical structures, alongside open-source tools for research and education."
copyright = "© 2026 Mathieu Aucejo"

